name: Deploy to GitHub Pages

# Every push to main is checked, built and published. Run it by hand from the Actions tab too.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces one still waiting
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Engine checks
        run: npm test
      - name: Build
        run: npm run build
      # only what the game serves: the page, the service worker, the manifest and the assets it loads
      - name: Stage the site
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest .nojekyll _site/
          cp -r art fonts icons sound _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
